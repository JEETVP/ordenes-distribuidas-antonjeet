services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orders_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orders_pass}
      POSTGRES_DB: ${POSTGRES_DB:-orders_db}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orders_user} -d ${POSTGRES_DB:-orders_db}"]
      interval: 5s
      retries: 5

  postgres-notifications:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${NOTIFICATIONS_DB_USER:-notifications_user}
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications_pass}
      POSTGRES_DB: ${NOTIFICATIONS_DB_NAME:-notifications_db}
    ports:
      - "5433:5432"
    volumes:
      - pg_notifications_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATIONS_DB_USER:-notifications_user} -d ${NOTIFICATIONS_DB_NAME:-notifications_db}"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      retries: 10

  writer-service:
    build: ./writer-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://orders_user:orders_pass@postgres:5432/orders_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/%2F}
      ORDERS_EXCHANGE: ${ORDERS_EXCHANGE:-orders}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  inventory-service:
    build: ./inventory-service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: ${INVENTORY_DATABASE_URL:-postgresql://orders_user:orders_pass@postgres:5432/orders_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/%2F}
      ORDERS_EXCHANGE: ${ORDERS_EXCHANGE:-orders}
      INVENTORY_QUEUE: ${INVENTORY_QUEUE:-inventory.order.created}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/%2F}
      ORDERS_EXCHANGE: ${ORDERS_EXCHANGE:-orders}
      NOTIFICATION_QUEUE: ${NOTIFICATION_QUEUE:-notification.order.created}
      DATABASE_URL: ${NOTIFICATIONS_DATABASE_URL:-postgresql://notifications_user:notifications_pass@postgres-notifications:5432/notifications_db}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-notifications:
        condition: service_healthy

  analytics-service:
    build: ./analytics-service
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/%2F}
      ORDERS_EXCHANGE: ${ORDERS_EXCHANGE:-orders}
      ANALYTICS_QUEUE: ${ANALYTICS_QUEUE:-analytics.order.created}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth-service:
    build: ./auth-service
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://orders_user:orders_pass@postgres:5432/orders_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8003}
      WRITER_SERVICE_URL: ${WRITER_SERVICE_URL:-http://writer-service:8001}
      WRITER_TIMEOUT_SECONDS: ${WRITER_TIMEOUT_SECONDS:-1.0}
      WRITER_MAX_RETRIES: ${WRITER_MAX_RETRIES:-1}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      writer-service:
        condition: service_started

volumes:
  pg_data:
  pg_notifications_data:
