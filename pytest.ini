[pytest]
# Configuración de pytest para tests E2E

# Directorio de tests
testpaths = tests

# Patrones de búsqueda de tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbosidad por defecto
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Marcadores personalizados
markers =
    health: Tests de health checks
    auth: Tests de autenticación
    inventory: Tests de inventario
    orders: Tests de órdenes
    e2e: Tests end-to-end completos
    error: Tests de manejo de errores
    slow: Tests lentos
    smoke: Pruebas rápidas críticas

# Timeout para tests (segundos)
timeout = 30

# Configuración de logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Mínimo de cobertura (si usas pytest-cov)
# addopts = --cov=app --cov-report=html

# Configuración para reportes
# Descomenta si instalas pytest-html
# addopts = --html=report.html --self-contained-html
