name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Docker Compose config
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env config

      - name: Build services
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env build

      - name: Start services
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env up -d

      - name: Wait for API services
        run: |
          for url in \
            http://localhost:8000/health \
            http://localhost:8001/health \
            http://localhost:8002/health \
            http://localhost:8003/health
          do
            echo "Waiting for $url"
            timeout 120 bash -c "until curl --fail --silent --show-error '$url'; do sleep 5; done"
          done

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env logs --tail=100

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env down -v
